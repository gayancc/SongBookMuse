name: Application checks

on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        host: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev
      - run: npm ci
      - run: cargo fmt --check --all
      - run: cargo test --locked -p muse-core
      - run: npm run tauri -- build --debug --no-bundle
      - if: runner.os == 'Windows'
        run: npm run test:ui
