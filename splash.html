<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SongBookMuse</title>
  </head>
  <body>
    <main class="stage" aria-label="SongBookMuse is starting">
      <canvas class="field" aria-hidden="true"></canvas>
      <div class="mark">
        <svg class="disc" viewBox="0 0 256 256" aria-hidden="true">
          <defs>
            <radialGradient id="disc-face" cx="38%" cy="30%" r="80%">
              <stop offset="0" stop-color="#2b332d" />
              <stop offset=".55" stop-color="#1c221d" />
              <stop offset="1" stop-color="#121613" />
            </radialGradient>
            <linearGradient id="bar-face" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e4efbd" />
              <stop offset="1" stop-color="#b9c983" />
            </linearGradient>
            <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset=".5" stop-color="#fff" stop-opacity=".22" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <clipPath id="disc-clip"><circle cx="128" cy="128" r="120" /></clipPath>
          </defs>
          <circle cx="128" cy="128" r="120" fill="url(#disc-face)" />
          <circle class="rim" cx="128" cy="128" r="119" fill="none" />
          <g clip-path="url(#disc-clip)">
            <rect class="bar" x="61" y="69" width="20" height="100" rx="1.5" />
            <rect class="bar" x="92" y="83" width="20" height="100" rx="1.5" />
            <rect class="bar" x="123" y="97" width="20" height="100" rx="1.5" />
            <rect class="sheen" x="-120" y="0" width="90" height="256" fill="url(#sheen)" transform="skewX(-18)" />
          </g>
          <circle class="sweep" cx="128" cy="128" r="126" fill="none" pathLength="100" />
        </svg>
      </div>
      <p class="wordmark" aria-hidden="true"><span>SongBook</span><b>Muse</b></p>
    </main>
    <script type="module" src="/ui/splash/splash.ts"></script>
  </body>
</html>
